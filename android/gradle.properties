# Project-wide Gradle settings.
#
# Tuned for a small build box (2 vCPU / ~2 GB cgroup) — a single worker and a
# small heap keep the build inside memory. Raise these on a bigger machine.

org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx320m

android.useAndroidX=true
